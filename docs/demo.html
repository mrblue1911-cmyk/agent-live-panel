<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Live Pane — replay</title>
<style>
  html, body { margin: 0; padding: 0; background: #060a06; }
  #pane { width: 430px; height: 500px; }

/* --- verbatim from plugin.js (CRYPTO_CSS) --- */
.alp-root {
  box-sizing: border-box;
  height: 100%;
  overflow-y: auto;
  padding: 10px 12px;
  font-family: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
  font-size: 11px;
  line-height: 1.55;
  letter-spacing: 0.02em;
  color: #33ff66;
  background-color: #060a06;
  background-image:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0px, rgba(0, 0, 0, 0.22) 1px, transparent 1px, transparent 3px),
    radial-gradient(ellipse at 50% 0%, rgba(51, 255, 102, 0.06), transparent 70%);
  text-shadow: 0 0 6px rgba(51, 255, 102, 0.45);
  user-select: text;
  white-space: pre-wrap;
  word-break: break-word;
}
.alp-root::-webkit-scrollbar { width: 8px; }
.alp-root::-webkit-scrollbar-thumb { background: #1d4a2a; border-radius: 4px; }
.alp-root::-webkit-scrollbar-track { background: transparent; }
.alp-line { display: flex; gap: 8px; padding: 1px 0; align-items: flex-start; }
.alp-time {
  flex: none;
  color: #1e7a35;
  text-shadow: none;
  font-size: 10px;
  padding-top: 2px;
}
.alp-body { flex: 1; min-width: 0; }
.alp-msg { color: #d9f7e1; }
.alp-think { color: #2e8f4e; font-style: italic; opacity: 0.9; }
.alp-tool { color: #ffb000; text-shadow: 0 0 6px rgba(255, 176, 0, 0.4); }
.alp-args { color: #b97f00; }
.alp-result { color: #8fdf9f; }
.alp-usage { color: #7ef0ff; text-shadow: 0 0 6px rgba(126, 240, 255, 0.35); }
.alp-status { color: #7fae8f; }
.alp-prompt { color: #ffd75e; text-shadow: 0 0 6px rgba(255, 215, 94, 0.4); }
.alp-error { color: #ff5555; text-shadow: 0 0 6px rgba(255, 85, 85, 0.5); }
.alp-raw { color: #6f9a7f; opacity: 0.8; }
.alp-sys { color: #1e7a35; }
/* --- end verbatim --- */
</style>
</head>
<body>
<div id="pane" class="alp-root"></div>
<script>
// Playback of a scripted event log through the pane's own line logic.
// All frame state is computed from a time value, so a capture is exact:
// renderAt(ms) is idempotent and nothing here depends on wall-clock timers.

const MAX_LINES = 500;
let lines = [];

function push(kind, text, open = false, t = 0) {
  lines.push({ kind, text, open, t });
  if (lines.length > MAX_LINES) lines = lines.slice(lines.length - MAX_LINES);
}
function appendTo(kind, delta, t) {
  const last = lines[lines.length - 1];
  if (last && last.kind === kind && last.open) last.text += delta;
  else push(kind, delta, true, t);
}
function closeOpen(kind) {
  const last = lines[lines.length - 1];
  if (last && last.kind === kind && last.open) last.open = false;
}

const pretty = (v) => JSON.stringify(v, null, 2);

function fmtUsage(u) {
  const parts = [];
  parts.push(`prompt ${u.prompt.toLocaleString('en-US')} tokens (+${u.dIn.toLocaleString('en-US')})`);
  parts.push(`· eval ${u.completion.toLocaleString('en-US')} tokens`);
  if (u.reasoning) parts.push(`· reasoning ${u.reasoning.toLocaleString('en-US')} tokens`);
  parts.push(`· ctx ${u.ctxUsed}/${u.ctxMax} (${u.ctxPct}%)`);
  return `[${u.model}] ${parts.join(' ')}`;
}

// --- the scripted run -------------------------------------------------------
// A real-shaped turn: user ask -> reasoning -> two tool calls with full args
// and full results -> per-call token spend -> answer.

const T0 = 9 * 3600 + 41 * 60 + 12; // 09:41:12, for the timestamp column

const EVENTS = [];
const at = (ms, fn) => EVENTS.push({ t: ms, fn });

function stream(ms, gap, kind, text, chunk = 7) {
  at(ms, () => { if (kind === 'msg') { closeOpen('think'); push('msg', '', true, ms); } });
  for (let i = 0; i < text.length; i += chunk) {
    const t = ms + (i / text.length) * gap;
    at(t, () => appendTo(kind, text.slice(i, i + chunk), t));
  }
}

stream(120, 900, 'msg', 'What is actually eating the space in this folder?');

at(1150, () => { closeOpen('msg'); push('think', '', true, 1150); });
stream(1150, 900, 'think', 'Sort by size first, then look inside the winner before saying anything. Fail on it and I have to walk it back.');

at(2150, () => push('tool', '❯ terminal  list by size', true, 2150));
at(2500, () => {
  const last = lines[lines.length - 1];
  last.text = '❯ terminal  list by size  ✓ (0.8s)';
  last.open = false;
  push('args', 'args: ' + pretty({ command: 'ls -lhS | head -4' }), false, 2500);
  push('result', 'result: ' + (
    '-rw-r--r-- 1 blue 892M session.db\n' +
    '-rw-r--r-- 1 blue 140M skills.tar\n' +
    '-rw-r--r-- 1 blue  12M notes.md'
  ), false, 2500);
});

at(3450, () => push('tool', '❯ read_file  peek at the winner', true, 3450));
at(3800, () => {
  const last = lines[lines.length - 1];
  last.text = '❯ read_file  peek at the winner  ✓ (0.2s)';
  last.open = false;
  push('args', 'args: ' + pretty({ path: 'notes.md', limit: 20 }), false, 3800);
  push('result', 'result: "## Monday\n- call the plumber\n- send invoice to J."', false, 3800);
});

at(4750, () => push('usage', fmtUsage({
  model: 'deepseek-v4.1-flash', prompt: 12480, dIn: 1204, completion: 431,
  reasoning: 118, ctxUsed: '12.5k', ctxMax: '200k', ctxPct: 6
}), false, 4750));

stream(5300, 900, 'msg', 'session.db is 892 MB and it is a state file, not work. skills.tar is 140 MB, notes.md is 12 MB. Nothing here is safe to delete.');
at(6900, () => {
  closeOpen('msg');
  push('raw', 'pet.state.changed {"mood":"focused"}', false, 6900);
});

// --- renderer ---------------------------------------------------------------

const pane = document.getElementById('pane');

function stamp(t) {
  const s = Math.floor(T0 + t / 1000);
  return [s / 3600 | 0, (s % 3600) / 60 | 0, s % 60].map((n) => String(n | 0).padStart(2, '0')).join(':');
}

window.renderAt = function (ms) {
  lines = [];
  for (const e of EVENTS) {
    if (e.t > ms) break;
    e.fn();
  }
  if (!lines.length) {
    pane.innerHTML = '<div class="alp-line alp-sys"><span class="alp-body">◆ AGENT LIVE PANE — engine log awaiting stream…</span></div>';
    return;
  }
  pane.innerHTML = lines.map((l) =>
    `<div class="alp-line alp-${l.kind}"><span class="alp-time">${stamp(l.t)}</span><span class="alp-body">${esc(l.text)}</span></div>`
  ).join('');
  pane.scrollTop = pane.scrollHeight;
};

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

window.renderAt(Number(new URLSearchParams(location.search).get('t') || 0));
window.DURATION_MS = 9000;
</script>
</body>
</html>
